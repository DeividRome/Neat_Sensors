<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neat Pulse API - Monitor de salas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#E6ECF5;
  --ink:#0A1224;
  --muted:#4A5468;
  --blue:#043172;
  --blue-3:#6FA8FF;
  --cyan:#50E4FE;
  --ok:#2FBF7E;
  --warn:#F2B441;
  --bad:#E5484D;
  --gray:#8A95A6;
  --sh-d:#C3CDDD;
  --sh-l:#FFFFFF;
  --raised:8px 8px 16px var(--sh-d), -8px -8px 16px var(--sh-l);
  --raised-sm:5px 5px 10px var(--sh-d), -5px -5px 10px var(--sh-l);
  --raised-xs:3px 3px 6px var(--sh-d), -3px -3px 6px var(--sh-l);
  --inset:inset 5px 5px 10px var(--sh-d), inset -5px -5px 10px var(--sh-l);
  --r:18px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif}
h1,h2,h3{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100dvh}

/* Menú lateral */
.side{position:sticky;top:0;height:100dvh;padding:32px 24px;display:flex;flex-direction:column;gap:36px}
.brand{display:grid;gap:2px;justify-items:center;text-align:center}
.logo{display:flex;justify-content:center}
.api-badge{display:inline-flex;align-items:center;justify-self:center;min-height:40px;padding:0 18px;border-radius:999px;box-shadow:var(--inset);font:600 16px 'Space Grotesk',system-ui,sans-serif;color:var(--blue)}
.brand-sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.logo svg{height:34px;width:auto;display:block;fill:var(--blue)}
.nav{display:flex;flex-direction:column;gap:14px;padding:6px}
.nav a{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 18px;border-radius:999px;color:var(--ink);text-decoration:none;font:600 15px 'Space Grotesk',system-ui,sans-serif;transition:box-shadow 240ms var(--ease),color 240ms var(--ease)}
.nav a:hover{box-shadow:var(--raised-sm)}
.nav a[aria-current="page"]{box-shadow:var(--inset);color:var(--blue)}
.nav a:focus-visible,.btn:focus-visible,.seg button:focus-visible,.switch:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.ico{width:20px;height:20px;flex:none}
.side,.main-col{min-width:0}
.source{margin-top:auto;color:var(--muted);font-size:14px;text-align:center}
.source p{margin:16px 0 0}
a.btn{text-decoration:none;color:var(--ink)}


/* Contenido */
.main{padding:32px 40px 56px;max-width:1360px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:20px 32px;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
h1{font-size:32px;line-height:1.15;font-weight:600}
.desc{margin:6px 0 0;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center}
.status{margin:0 0 28px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.tag{display:inline-block;padding:3px 14px;border-radius:999px;box-shadow:var(--inset);font:600 13px 'Space Grotesk',system-ui,sans-serif;color:var(--muted)}

/* Botones y controles neumórficos */
.btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 22px;border:0;border-radius:999px;background:var(--bg);box-shadow:var(--raised-sm);font:600 14px 'Space Grotesk',system-ui,sans-serif;cursor:pointer;transition:box-shadow 150ms var(--ease)}
.btn:active{box-shadow:var(--inset)}
.btn[aria-busy="true"] .ico{animation:spin 900ms linear infinite}
.live{width:10px;height:10px;border-radius:50%;background:var(--cyan);flex:none;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(80,228,254,.55)}100%{box-shadow:0 0 0 9px rgba(80,228,254,0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Selector de salas */
.picker{position:relative}
.panel{position:absolute;right:0;top:calc(100% + 14px);z-index:30;width:min(320px,calc(100vw - 32px));max-height:min(70vh,460px);overflow:auto;padding:20px;border-radius:var(--r);background:var(--bg);box-shadow:var(--raised)}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.panel-head strong{font:600 16px 'Space Grotesk',system-ui,sans-serif}
.panel ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.panel-actions{margin-top:14px;display:flex;justify-content:flex-end}
.check{display:flex;align-items:center;gap:14px;min-height:44px;cursor:pointer;position:relative;padding:0 4px}
.check input{position:absolute;opacity:0;width:24px;height:24px;margin:0;left:4px;cursor:pointer}
.check .box{width:24px;height:24px;border-radius:8px;box-shadow:var(--inset);flex:none;position:relative;transition:background 240ms var(--ease),box-shadow 240ms var(--ease)}
.check input:checked + .box{background:var(--blue);box-shadow:var(--raised-xs)}
.check input:checked + .box::after{content:'';position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.check input:focus-visible + .box{outline:3px solid var(--blue);outline-offset:3px}
.check input:disabled{cursor:not-allowed}
.check input:disabled + .box{opacity:.55}
.check .lbl{font-weight:500;min-width:0;overflow-wrap:anywhere;line-height:1.3}
.check{padding-top:6px;padding-bottom:6px}
.auto{display:inline-flex;align-items:center;gap:12px;min-height:44px;font-size:14px;font-weight:500;color:var(--muted)}
.switch{width:56px;height:32px;border:0;border-radius:999px;background:var(--bg);box-shadow:var(--inset);position:relative;cursor:pointer;padding:0;flex:none}
.switch .knob{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--bg);box-shadow:var(--raised-xs);transition:transform 240ms var(--ease),background 240ms var(--ease)}
.switch[aria-checked="true"] .knob{transform:translateX(24px);background:var(--blue)}

.seg{display:inline-flex;gap:4px;padding:6px;border-radius:999px;box-shadow:var(--inset)}
.seg button{min-height:44px;padding:0 18px;border:0;border-radius:999px;background:transparent;font:600 14px 'Space Grotesk',system-ui,sans-serif;color:var(--muted);cursor:pointer;transition:box-shadow 240ms var(--ease),color 240ms var(--ease)}
.seg button[aria-pressed="true"]{background:var(--bg);box-shadow:var(--raised-xs);color:var(--blue)}

/* Tarjetas */
.card{background:var(--bg);border-radius:var(--r);box-shadow:var(--raised);padding:24px}
.card h2{font-size:20px;font-weight:600}
.card h3{font-size:20px;font-weight:600}
.sub{margin:4px 0 16px;color:var(--muted);font-size:14px}
.stack{display:grid;gap:28px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kl{color:var(--muted);font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.kv{font:600 40px/1.1 'Space Grotesk',system-ui,sans-serif;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.kv small{font-size:18px;color:var(--muted);font-weight:500;margin-left:4px}
.kc{color:var(--muted);font-size:14px}
.charts{display:grid;grid-template-columns:1.25fr 1.25fr 1fr;gap:28px}
.chart{position:relative;height:260px}
.chart.tall{height:340px}
.section-title{font-size:22px;font-weight:600;margin:0 0 -8px}
.section-title:not(:first-child){margin-top:16px}

/* Cartas de sala */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px}
.room header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:6px 12px}
.room h3{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.room header .state{flex:none}
.room .meta{margin:4px 0 18px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.room-body{display:flex;align-items:center;gap:20px}
.well{width:88px;height:88px;border-radius:50%;box-shadow:var(--inset);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.well b{font:600 32px/1 'Space Grotesk',system-ui,sans-serif;color:var(--blue);font-variant-numeric:tabular-nums}
.well.empty b{color:var(--muted)}
.well span{font-size:13px;color:var(--muted)}
.room dl{margin:0;display:grid;gap:10px;flex:1;min-width:0}
.room dl div{display:block}
.room dt{color:var(--muted);font-size:14px;line-height:1.2}
.room dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{padding:4px 12px;border-radius:999px;box-shadow:var(--inset);font-size:13px;font-weight:600}
.legend ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px;font-size:14px;color:var(--muted)}
.legend li{display:flex;gap:12px;align-items:baseline}
.legend li .state{min-width:76px}

/* Estados con texto + punto */
.state{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap}
.state i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ok)}
.state.warn i{background:var(--warn)}
.state.bad i{background:var(--bad)}
.state.na i{background:var(--gray)}

/* Tablas */
.tablewrap{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-size:14px;font-weight:600;padding:10px 12px;white-space:nowrap}
td{padding:14px 12px;border-top:1px solid rgba(10,18,36,.08);vertical-align:middle}
th.num,td.num{text-align:right}
.muted{color:var(--muted);font-size:14px}

.notice{box-shadow:var(--inset);border-radius:var(--r);padding:16px 20px;margin-bottom:24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.empty{color:var(--muted);padding:24px 4px}
.chart .empty{display:flex;align-items:center;justify-content:center;height:100%;text-align:center;box-shadow:var(--inset);border-radius:var(--r)}

@media (max-width:1100px){
  .charts{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1023px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:20px 16px 0;gap:8px}
  .brand{justify-items:start;text-align:left}
  .logo{justify-content:flex-start}
  .api-badge{justify-self:start}
  .nav{flex-direction:row;overflow-x:auto;padding:10px 10px 18px;gap:12px}
  .nav a{flex:none}
  .source{display:none}
  .main{padding:16px 16px 40px}
}
@media (max-width:760px){
  .kpis.three{grid-template-columns:1fr}
}
@media (max-width:600px){
  .panel{position:fixed;left:16px;right:16px;bottom:16px;top:auto;width:auto;max-height:70vh}
}
@media (max-width:480px){
  .kpis{grid-template-columns:1fr}
  .card{padding:20px}
  .room-body{gap:16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>

<script>
(function () {

const T = { tempMin: 20, tempMax: 27, humMin: 30, humMax: 60, vocGood: 100, vocWarn: 250, co2Good: 800, co2Warn: 1200, staleMin: 10 };
const C = { orange: '#E8710A', sky: '#1E88E5', ink: '#0A1224', blue: '#043172', blue3: '#6FA8FF', gray: '#8A95A6', grid: 'rgba(10,18,36,.08)', ok: '#2FBF7E', warn: '#F2B441', bad: '#E5484D', bg: '#E6ECF5' };
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Utilidades ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const PATHS = {
  layout: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',

  wind: '<path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>',

const fmtTime = ts => new Date(ts * 1000).toLocaleTimeString('es-MX', { timeZone: CONFIG.TZ, hour12: false });
const ageMin = ts => Math.max(0, (Date.now() / 1000 - ts) / 60);
const ago = ts => {
  const m = ageMin(ts);
  if (m < 1) return 'hace <1 min';
  if (m < 60) return `hace ${Math.floor(m)} min`;
  return `hace ${Math.floor(m / 60)} h`;
};
const isStale = r => ageMin(r.ts) > T.staleMin;

const airLabel = v => v <= T.vocGood ? 'Bueno' : v <= T.vocWarn ? 'Regular' : 'Malo';
const co2Label = v => v <= T.co2Good ? 'Bueno' : v <= T.co2Warn ? 'Regular' : 'Malo';
const airCls = l => l === 'Bueno' ? 'ok' : l === 'Regular' ? 'warn' : l === 'Malo' ? 'bad' : 'na';
const airRank = r => ({ Malo: 3, Regular: 2, Bueno: 1 })[r.air] || 0;
const tempState = t => t < T.tempMin ? 'Fría' : t > T.tempMax ? 'Cálida' : 'En confort';
const humState = h => h < T.humMin ? 'Seca' : h > T.humMax ? 'Húmeda' : 'En confort';
const comfortCls = s => s === 'En confort' ? 'ok' : 'warn';
const state = (label, cls) => `<span class="state ${cls}"><i></i>${label}</span>`;

function prep(r) {
  const vocI = Math.round(r.vocIndex || 0), co2 = Math.round(r.co2 || 0);
  // Algunos equipos reportan VOC Index y otros CO₂. Se usa la medición que tenga la sala.
  let air = 'Sin dato', airMetric = '', airText = 'Sin dato';
  if (vocI > 0) { air = airLabel(vocI); airMetric = 'VOC Index'; airText = String(vocI); }
  else if (co2 > 0) { air = co2Label(co2); airMetric = 'CO₂'; airText = co2 + ' ppm'; }
  return Object.assign({}, r, {
    t: Math.round(r.temp), h: Math.round(r.humidity), voc: vocI, co2, lux: Math.round(r.illumination),
    air, airMetric, airText
  });
}
function alertsOf(r) {
  const a = [];
  if (isStale(r)) a.push('Sin datos recientes');
  if (r.t < T.tempMin) a.push('Temperatura baja'); else if (r.t > T.tempMax) a.push('Temperatura alta');
  if (r.h < T.humMin) a.push('Humedad baja'); else if (r.h > T.humMax) a.push('Humedad alta');
  if (r.air === 'Regular') a.push('Aire regular'); else if (r.air === 'Malo') a.push('Aire malo');
  return a;
}

let mock = null;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

async function fetchMock() {
  await new Promise(r => setTimeout(r, 350));

/* ---------- Historial (alimenta las líneas de tiempo) ---------- */
const HKEY = 'wt_history_v1', HMAX = 120;
let hist = [];

function seedHistory() {            // solo datos de ejemplo: simula la última hora
  const now = Math.floor(Date.now() / 1000), N = 30, step = 120;
  const cur = BASE.map(b => ({ temp: b.temp, humidity: b.humidity, vocIndex: b.vocIndex, co2: b.co2, illumination: b.illumination, people: b.people }));
  const snaps = [];
  for (let i = 1; i <= N; i++) {    // camina hacia atrás desde el valor actual
    const t = now - i * step, r = {};
    BASE.forEach((b, k) => {
      if (b.age > 600 && t > now - b.age) return;   // la sala sin datos recientes no tiene lecturas nuevas
      const c = cur[k];
      c.temp = clamp(c.temp + rnd(-0.35, 0.35), 18, 31);
      c.humidity = clamp(c.humidity + rnd(-1.5, 1.5), 20, 75);
      if (c.vocIndex > 0) c.vocIndex = clamp(c.vocIndex + rnd(-9, 9), 20, 400);
      if (c.co2 > 0) c.co2 = clamp(c.co2 + rnd(-30, 30), 400, 1600);
      c.illumination = clamp(c.illumination + rnd(-25, 25), 0, 900);
      if (Math.random() < 0.2) c.people = clamp(c.people + (Math.random() < 0.5 ? -1 : 1), 0, 12);
      r[b.id] = { temp: +c.temp.toFixed(1), humidity: +c.humidity.toFixed(1), vocIndex: Math.round(c.vocIndex), co2: Math.round(c.co2), illumination: Math.round(c.illumination), people: c.people };
    });
    snaps.push({ t, r });
  }
  hist = snaps.reverse();
}
function loadHistory() {
  hist = [];
  if (CONFIG.MOCK) { seedHistory(); return; }
  try {                              // con datos reales se guarda en este navegador (últimas 6 h)
    const raw = JSON.parse(localStorage.getItem(HKEY) || '[]');
    const min = Date.now() / 1000 - 6 * 3600;
    hist = Array.isArray(raw) ? raw.filter(x => x && x.t > min) : [];
  } catch (e) { hist = []; }
}
function pushHistory(list) {
  const r = {};
  list.forEach(x => {
    if (isStale(x)) return;
    r[x.id] = { temp: +x.temp.toFixed(1), humidity: +x.humidity.toFixed(1), vocIndex: Math.round(x.vocIndex), co2: Math.round(x.co2 || 0), illumination: Math.round(x.illumination), people: x.people };
  });
  hist.push({ t: Math.floor(Date.now() / 1000), r });
  if (hist.length > HMAX) hist = hist.slice(-HMAX);
  if (!CONFIG.MOCK) { try { localStorage.setItem(HKEY, JSON.stringify(hist)); } catch (e) { /* sin almacenamiento */ } }
}
const seriesOf = (id, key) => hist.filter(x => x.r[id] && ((key !== 'vocIndex' && key !== 'co2') || x.r[id][key] > 0)).map(x => ({ x: x.t, y: x.r[id][key] }));
const totalSeries = fn => hist.map(x => ({ x: x.t, y: fn(Object.values(x.r)) }));
const meanOf = (arr, key) => arr.length ? arr.reduce((a, r) => a + r[key], 0) / arr.length : 0;

/* ---------- Datos reales (a través del Worker) ---------- */
// Convierte el formato del API de Neat ({roomData|endpointData:{data:[...]}}) a un objeto plano.
function normalizeRoom(r) {
  const block = r.roomData || r.endpointData;
  const d = block && block.data && block.data[0];
  if (!d) throw new Error('sin datos de sensor');
  return { id: r.id, name: r.name, ts: Number(d.timestamp), temp: d.temp, humidity: d.humidity, vocIndex: d.vocIndex, co2: d.co2, illumination: d.illumination, people: d.people };
}
async function fetchLive() {
  if (!CONFIG.API_URL) throw new Error('falta configurar API_URL');
  const KEY = 'wt_access_key';
  const call = k => fetch(CONFIG.API_URL, { headers: k ? { 'X-Access-Key': k } : {} });
  let stored = '';
  try { stored = localStorage.getItem(KEY) || ''; } catch (e) { /* sin almacenamiento */ }
  let res = await call(stored);
  if (res.status === 401) {
    // Solo si el Worker exige clave: se pide una vez y se guarda en este navegador
    try { localStorage.removeItem(KEY); } catch (e) { /* */ }
    const k = window.prompt(stored ? 'La clave guardada ya no funciona. Escribe la clave de acceso' : 'Este panel requiere clave de acceso');
    if (!k) throw new Error('falta la clave de acceso');
    res = await call(k);
    if (res.status === 401) throw new Error('clave de acceso incorrecta');
    try { localStorage.setItem(KEY, k); } catch (e) { /* */ }
  }
  if (!res.ok) throw new Error('respuesta ' + res.status);
  const json = await res.json();            // { rooms: [ { id, name, roomData:{ data:[...] } } ] }
  const ok = [];
  missing = [];
  catalog = (json.rooms || []).map(r => ({ id: r.id, name: r.name || String(r.id) }));
  (json.rooms || []).forEach(r => {
    try { ok.push(normalizeRoom(r)); } catch (e) { missing.push({ id: r.id, name: r.name || String(r.id) }); }
  });
  if (!ok.length) throw new Error('ninguna sala devolvió datos de sensor');
  return ok;
}

// Animación "progressive line with easing" de Chart.js: la línea se dibuja punto por punto
function progressive(n) {
  const ease = Chart.helpers.easingEffects.easeOutQuad;
  const total = Math.min(2400, 900 + n * 30);
  const duration = ctx => ease(ctx.index / n) * total / n;
  const delay = ctx => ease(ctx.index / n) * total;
  const previousY = ctx => {
    const ch = ctx.chart, meta = ch.getDatasetMeta(ctx.datasetIndex);
    const prev = ctx.index > 0 && meta && meta.data ? meta.data[ctx.index - 1] : null;
    if (prev) return prev.getProps(['y'], true).y;
    const d = ch.data.datasets[ctx.datasetIndex];
    return ch.scales && ch.scales.y && d && d.data[0] ? ch.scales.y.getPixelForValue(d.data[0].y) : NaN;
  };
  return {
    x: { type: 'number', easing: 'linear', duration, from: NaN,
      delay(ctx) { if (ctx.type !== 'data' || ctx.xStarted) return 0; ctx.xStarted = true; return delay(ctx); } },
    y: { type: 'number', easing: 'linear', duration, from: previousY,
      delay(ctx) { if (ctx.type !== 'data' || ctx.yStarted) return 0; ctx.yStarted = true; return delay(ctx); } }
  };
}

// 10 colores bien distintos. Cada sala conserva su color en todas las gráficas aunque ocultes otras.
const ROOM_COLORS = ['#043172', '#E8710A', '#7B3FE4', '#0E9AA7', '#D81B60', '#2E7D32', '#8D6E63', '#1E88E5', '#B58900', '#546E7A'];
const ROOM_DASH = [[], [8, 4], [3, 3]];   // si hay más de 10 salas, los colores se repiten con otro trazo
const ds = (label, color, data, extra) => Object.assign({ label, data, borderColor: color, borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: color, tension: 0.25 }, extra || {});
const roomIdx = r => Math.max(0, catalog.findIndex(c => String(c.id) === String(r.id)));
const roomSets = key => rooms.map(r => { const i = roomIdx(r); return ds(r.name, ROOM_COLORS[i % 10], seriesOf(r.id, key), { borderDash: ROOM_DASH[Math.floor(i / 10) % 3] }); }).filter(d => d.data.length > 0);
const limitLine = (label, val) => ({ label, data: [{ x: hist[0].t, y: val }, { x: hist[hist.length - 1].t, y: val }], borderColor: C.gray, borderDash: [2, 4], borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 0, isLimit: true });

function lineCfg(o) {
  const n = hist.length;
  return {
    type: 'line',
    data: { datasets: o.datasets },
    options: {
      animation: animating ? progressive(n) : false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: o.legend === false ? { display: false } : legendOpts,
        tooltip: { filter: i => !i.dataset.isLimit, callbacks: { title: it => fmtHM(it[0].parsed.x), label: c => ` ${c.dataset.label}: ${o.fmt(c.parsed.y)}` } }
      },
      scales: {
        x: { type: 'linear', min: hist[0].t, max: hist[n - 1].t, grid: { display: false }, ticks: { maxTicksLimit: 6, callback: v => fmtHM(v) } },
        y: { beginAtZero: !!o.zero, suggestedMin: o.ymin, suggestedMax: o.ymax, ticks: o.int ? { precision: 0 } : {}, grid: { color: C.grid }, title: { display: !!o.unit, text: o.unit } }
      }
    }
  };
}

    { label: 'Promedio', value: Math.round(avg(r => r.humidity)), unit: '%', caption: `entre ${rooms.length} salas` },
    { label: 'Sala más húmeda', value: hi.h, unit: '%', caption: esc(hi.name) },
    { label: 'Sala más seca', value: lo.h, unit: '%', caption: esc(lo.name) } ]; },
  chartTitle: 'Humedad en el tiempo', chartSub: 'Una línea por sala. Las líneas punteadas grises marcan el rango de confort',
  chart: () => lineCfg({ unit: '%', ymin: 20, ymax: 80, fmt: v => `${Math.round(v)} %`,
    datasets: [...roomSets('humidity'), limitLine(`Mínimo (${T.humMin} %)`, T.humMin), limitLine(`Máximo (${T.humMax} %)`, T.humMax)] }),
  cols: [
    { h: 'Sala', f: r => esc(r.name) },
    { h: 'Humedad', num: true, f: r => `${r.h} %` },
    { h: 'Estado', f: r => state(humState(r.h), comfortCls(humState(r.h))) },
    { h: 'Última lectura', f: lastReading }
  ]
});

VIEWS.aire = metricView({
  nav: 'Calidad del aire', icon: 'wind', title: 'Calidad del aire', desc: 'Cada equipo reporta VOC Index o CO₂, según su modelo. Se usa la medición que tenga cada sala.',
  sort: (a, b) => airRank(b) - airRank(a) || a.name.localeCompare(b.name),
  kpis: () => ['Bueno', 'Regular', 'Malo'].map(l => {
    const n = rooms.filter(r => r.air === l).length;
    const cap = l === 'Bueno' ? `VOC Index hasta ${T.vocGood} o CO₂ hasta ${T.co2Good} ppm`
      : l === 'Regular' ? `VOC Index ${T.vocGood + 1} a ${T.vocWarn} o CO₂ ${T.co2Good + 1} a ${T.co2Warn} ppm`
      : `VOC Index mayor a ${T.vocWarn} o CO₂ mayor a ${T.co2Warn} ppm`;
    return { label: state(l, airCls(l)), value: n, unit: n === 1 ? 'sala' : 'salas', caption: cap };
  }),
  charts: [
    { title: 'VOC Index en el tiempo', sub: 'Menos es mejor. Las líneas punteadas grises marcan los límites entre niveles', empty: 'Ninguna sala reporta VOC Index.',
      cfg: () => lineCfg({ zero: true, ymax: 300, fmt: v => `${Math.round(v)}`,
        datasets: [...roomSets('vocIndex'), limitLine(`Límite bueno (${T.vocGood})`, T.vocGood), limitLine(`Límite regular (${T.vocWarn})`, T.vocWarn)] }) },
    { title: 'CO₂ en el tiempo', sub: 'En ppm. Menos es mejor. Las líneas punteadas grises marcan los límites entre niveles', empty: 'Ninguna sala reporta CO₂.',
      cfg: () => lineCfg({ unit: 'ppm', ymin: 300, ymax: 1400, fmt: v => `${Math.round(v)} ppm`,
        datasets: [...roomSets('co2'), limitLine(`Límite bueno (${T.co2Good} ppm)`, T.co2Good), limitLine(`Límite regular (${T.co2Warn} ppm)`, T.co2Warn)] }) }
  ],
  cols: [
    { h: 'Sala', f: r => esc(r.name) },
    { h: 'Medición', f: r => r.airMetric ? `${r.airMetric} <strong>${r.airText}</strong>` : '<span class="muted">Sin dato</span>' },
    { h: 'Calidad', f: r => state(r.air, airCls(r.air)) },
    { h: 'Última lectura', f: lastReading }
  ]
});

VIEWS.luz = metricView({
  nav: 'Iluminación', icon: 'sun', title: 'Iluminación', desc: 'Nivel de luz medido por el sensor de cada sala, en lux.',
  sort: (a, b) => b.illumination - a.illumination,
  kpis: () => { const hi = top(r => r.illumination), lo = low(r => r.illumination); return [
    { label: 'Promedio', value: Math.round(avg(r => r.illumination)), unit: 'lx', caption: `entre ${rooms.length} salas` },
    { label: 'Sala más iluminada', value: hi.lux, unit: 'lx', caption: esc(hi.name) },
    { label: 'Sala más tenue', value: lo.lux, unit: 'lx', caption: esc(lo.name) } ]; },
  chartTitle: 'Iluminación en el tiempo', chartSub: 'Una línea por sala, en lux',
  chart: () => lineCfg({ zero: true, unit: 'lx', fmt: v => `${Math.round(v)} lx`, datasets: roomSets('illumination') }),
  cols: [
    { h: 'Sala', f: r => esc(r.name) },
    { h: 'Iluminación', num: true, f: r => `${r.lux} lx` },
    { h: 'Última lectura', f: lastReading }
  ]
});

/* ---------- Selección de salas (se guarda en este navegador) ---------- */
const HIDDEN_KEY = 'wt_rooms_hidden';   // se guardan las salas ocultas, así las salas nuevas aparecen solas
function loadHidden() {
  try { hidden = new Set(JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]').map(String)); } catch (e) { hidden = new Set(); }
}
function saveHidden() {
  try { localStorage.setItem(HIDDEN_KEY, JSON.stringify([...hidden])); } catch (e) { /* sin almacenamiento */ }
}
function applySelection() {
  rooms = allRooms.filter(r => !hidden.has(String(r.id)));
}
function renderPicker() {
  const list = $('#roomsList');
  if (!catalog.length) {
    list.innerHTML = '<li class="muted">Cargando salas...</li>';
    $('#roomsBtnLabel').textContent = 'Salas';
    $('#roomsCount').textContent = '';
    return;
  }
  const shown = catalog.filter(c => !hidden.has(String(c.id))).length;
  list.innerHTML = catalog.map(c => {
    const on = !hidden.has(String(c.id));
    const last = on && shown === 1;      // siempre queda al menos una sala visible
    return `<li><label class="check"><input type="checkbox" data-id="${esc(c.id)}"${on ? ' checked' : ''}${last ? ' disabled' : ''}><span class="box" aria-hidden="true"></span><span class="lbl">${esc(c.name)}</span></label></li>`;
  }).join('');
  $('#roomsBtnLabel').textContent = shown < catalog.length ? `Salas (${shown} de ${catalog.length})` : 'Salas';
  $('#roomsCount').textContent = `${shown} de ${catalog.length}`;
}
function selectionChanged() {
  saveHidden(); applySelection(); renderPicker(); render();
}
function showAll() { hidden.clear(); selectionChanged(); }
function setPanel(open) {
  $('#roomsPanel').hidden = !open;
  $('#roomsBtn').setAttribute('aria-expanded', String(open));
}

/* ---------- Render ---------- */
function render() {
  destroyCharts();
  const v = VIEWS[view];
  $('#title').textContent = v.title;
  $('#desc').textContent = v.desc;
  $('#filters').hidden = view !== 'dashboard';
  document.title = `${v.title} - Neat Pulse API`;
  document.querySelectorAll('#nav a').forEach(a => {
    if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  let notice = errorMsg ? `<div class="notice" role="alert">${state('Sin conexión', 'bad')}<span>${esc(errorMsg)}</span></div>` : '';
  const miss = missing.filter(m => !hidden.has(String(m.id)));
  if (miss.length) notice += `<div class="notice">${state('Sin lecturas', 'warn')}<span>Estas salas no devolvieron datos de sensor: ${miss.map(m => esc(m.name)).join(', ')}.</span></div>`;
  const el = $('#view');
  if (!allRooms.length) {
    el.innerHTML = notice + (errorMsg ? '' : '<p class="empty">Cargando datos de las salas...</p>');
    return;
  }
  if (!rooms.length) {
    el.innerHTML = notice + '<article class="card"><p class="empty">No hay salas seleccionadas.</p><button type="button" class="btn" id="showAllBtn">Mostrar todas las salas</button></article>';
    $('#showAllBtn').addEventListener('click', showAll);
    return;
  }
  animating = animateNext && !reduceMotion;
  el.innerHTML = notice + v.html();
  if (v.mount) v.mount();
  animateNext = false;
}

function tick() {
  $('#status').textContent = lastUpdate
    ? `Última actualización: ${fmtTime(lastUpdate)} (${ago(lastUpdate)})`
    : 'Cargando datos...';
}

function setBusy(b) {
  const btn = $('#refreshBtn');
  btn.setAttribute('aria-busy', b ? 'true' : 'false');
  btn.innerHTML = b
    ? `${icon('refresh')}Actualizando...`
    : `<span class="live" aria-hidden="true"></span>Actualizar ahora`;
}

async function refresh() {
  if (busy) return;
  busy = true; setBusy(true);
  try {
    const data = CONFIG.MOCK ? await fetchMock() : await fetchLive();
    allRooms = data.map(prep);
    pushHistory(allRooms);
    applySelection();
    renderPicker();
    lastUpdate = Date.now() / 1000;
    errorMsg = '';
  } catch (e) {
    errorMsg = `No se pudo actualizar: ${e.message || 'error de conexión'}.` + (allRooms.length ? ' Se muestran los últimos datos recibidos.' : '');
  } finally {
    busy = false; setBusy(false);
  }
  render(); tick();
}

function setAuto(on) {
  auto = on;
  $('#autoSwitch').setAttribute('aria-checked', String(on));
  clearInterval(timer);
  if (on) timer = setInterval(refresh, CONFIG.REFRESH_MS);
}

function route() {
  const h = location.hash.slice(1);
  view = VIEWS[h] ? h : 'dashboard';
  window.scrollTo(0, 0);
  animateNext = true;
  render();
}

/* ---------- Inicio ---------- */
function init() {
  $('#nav').innerHTML = Object.keys(VIEWS).map(k => `<a href="#${k}" data-view="${k}">${icon(VIEWS[k].icon)}<span>${VIEWS[k].nav}</span></a>`).join('');
  $('#autoLabel').textContent = `Actualizar cada ${Math.round(CONFIG.REFRESH_MS / 60000)} min`;
  $('#mockTag').hidden = !CONFIG.MOCK;

  loadHidden();
  renderPicker();
  $('#roomsBtn').addEventListener('click', () => setPanel($('#roomsPanel').hidden));
  $('#roomsAll').addEventListener('click', showAll);
  $('#roomsList').addEventListener('change', e => {
    const cb = e.target.closest('input[data-id]');
    if (!cb) return;
    if (cb.checked) hidden.delete(cb.dataset.id); else hidden.add(cb.dataset.id);
    selectionChanged();
    const again = $(`#roomsList input[data-id="${cb.dataset.id}"]`);   // renderPicker recrea la lista: se devuelve el foco
    if (again) again.focus();
  });
  document.addEventListener('click', e => { if (!$('#roomsPanel').hidden && !e.target.closest('.picker')) setPanel(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#roomsPanel').hidden) { setPanel(false); $('#roomsBtn').focus(); } });
  $('#refreshBtn').addEventListener('click', refresh);
  $('#autoSwitch').addEventListener('click', () => setAuto(!auto));
  $('#filters').addEventListener('click', e => {
    const b = e.target.closest('button[data-filter]');
    if (!b) return;
    filter = b.dataset.filter;
    document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  });
  window.addEventListener('hashchange', route);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && auto && lastUpdate && Date.now() / 1000 - lastUpdate > CONFIG.REFRESH_MS / 1000) refresh();
  });
  setInterval(tick, 15000);

  Chart.defaults.font.family = "'Archivo', system-ui, sans-serif";
  Chart.defaults.font.size = 13;
  Chart.defaults.color = '#4A5468';

  loadHistory();
  route();
  setAuto(true);
  refresh();
}
init();
})();
</script>
