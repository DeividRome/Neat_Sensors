<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitor de salas - Pantalla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECF5; --ink:#0A1224; --muted:#4A5468; --blue:#043172; --cyan:#50E4FE;
  --ok:#2FBF7E; --warn:#F2B441; --bad:#E5484D; --gray:#8A95A6;
  --sh-d:#C3CDDD; --sh-l:#FFFFFF;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
body.idle{cursor:none}
h1,h2{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;margin:0}

.screen{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:2.2vh;padding:2.4vh 2.4vw}

/* Encabezado */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:2vw;min-height:7vh}
.brand{display:flex;align-items:center;gap:2vw;min-width:0}
.logo svg{height:5.4vh;width:auto;display:block;fill:var(--blue)}
.title{display:flex;align-items:center;gap:1.6vw;min-width:0;flex-wrap:wrap}
.title h1{font-size:max(3.6vh,18px);font-weight:600;line-height:1.1}
.pill{display:inline-flex;align-items:center;padding:.7vh 1.4vw;border-radius:999px;box-shadow:inset .3vh .3vh .7vh var(--sh-d),inset -.3vh -.3vh .7vh var(--sh-l);font:600 max(1.9vh,13px) 'Space Grotesk',system-ui,sans-serif;color:var(--blue);white-space:nowrap}
.clock{text-align:right;flex:none}
.clock b{display:block;font:600 max(5vh,24px)/1 'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.clock span{display:flex;align-items:center;justify-content:flex-end;gap:.8vh;margin-top:.6vh;color:var(--muted);font-size:max(1.7vh,12px);font-variant-numeric:tabular-nums}
.live{width:1.1vh;height:1.1vh;min-width:8px;min-height:8px;border-radius:50%;background:var(--cyan);flex:none}
.live.off{background:var(--gray)}

/* Indicadores */
.kpis{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.8vw}
.kpi{border-radius:2vh;background:var(--bg);box-shadow:.7vh .7vh 1.5vh var(--sh-d),-.7vh -.7vh 1.5vh var(--sh-l);padding:1.4vh 1.6vw;display:flex;flex-direction:column;justify-content:center;min-height:11vh}
.kpi .l{color:var(--muted);font-size:max(1.8vh,13px);font-weight:500}
.kpi .v{font:600 max(5.2vh,24px)/1.1 'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums;margin-top:.4vh}
.kpi .v small{font-size:.45em;color:var(--muted);font-weight:500;margin-left:.3em}

/* Cartas de sala: el tamaño de letra (em) lo calcula el script según el espacio disponible */
.grid{flex:1;min-height:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center}
.rc{flex:none;background:var(--bg);border-radius:1.1em;box-shadow:.4em .4em .8em var(--sh-d),-.4em -.4em .8em var(--sh-l);padding:1em 1.1em;display:flex;flex-direction:column;overflow:hidden}
.rc header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:.3em .6em}
.rc h2{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;font-size:1.2em;line-height:1.2;font-weight:600}
.state{flex:none;display:inline-flex;align-items:center;gap:.4em;font-weight:600;font-size:.8em;white-space:nowrap}
.state i{width:.65em;height:.65em;border-radius:50%;background:var(--ok);flex:none}
.state.warn i{background:var(--warn)}
.state.bad i{background:var(--bad)}
.state.na i{background:var(--gray)}
.body{flex:1;min-height:0;display:flex;align-items:center;gap:1em}
.well{width:6.6em;height:6.6em;border-radius:50%;box-shadow:inset .3em .3em .6em var(--sh-d),inset -.3em -.3em .6em var(--sh-l);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.well b{font:600 3.1em/1 'Space Grotesk',system-ui,sans-serif;color:var(--blue);font-variant-numeric:tabular-nums}
.well.empty b{color:var(--muted)}
.well span{font-size:.75em;color:var(--muted)}
.rc dl{margin:0;display:grid;gap:.45em;min-width:0;flex:1}
.rc dt{color:var(--muted);font-size:.75em;line-height:1.1}
.rc dd{margin:0;font:600 1.45em/1.15 'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.4em;min-height:1.6em}
.chips li{padding:.15em .7em;border-radius:999px;box-shadow:inset .15em .15em .3em var(--sh-d),inset -.15em -.15em .3em var(--sh-l);font-size:.7em;font-weight:600}
.rc.stale .well,.rc.stale dl{opacity:.5}

/* Mensajes */
.msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.4vh;color:var(--muted);padding:4vh 6vw}
.msg strong{font:600 max(3.4vh,20px) 'Space Grotesk',system-ui,sans-serif;color:var(--ink)}
.msg span{font-size:max(2.2vh,14px);max-width:60ch}

@media (prefers-reduced-motion:no-preference){ .live:not(.off){animation:pulse 2.4s ease-out infinite} }
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(80,228,254,.55)}100%{box-shadow:0 0 0 .9vh rgba(80,228,254,0)}}
</style>

'use strict';

/* ---------- Configuración ---------- */
// Parámetros opcionales en la dirección:
//   ?salas=22,4,5   solo esas salas (IDs)        ?cada=60    actualizar cada 60 s (mínimo 30)
//   ?clave=XXXX     clave de acceso, si el Worker la exige (se guarda y se quita de la dirección)
//   ?demo           datos de ejemplo
const qp = new URLSearchParams(location.search);
const CONFIG = {
  DEMO: qp.has('demo'),
  API_URL: 'https://neat-pulse-proxy.david-jonas1094.workers.dev/rooms',
  EVERY_MS: Math.max(30, Number(qp.get('cada')) || 120) * 1000,
  RETRY_MS: 20000,
  RELOAD_MS: 6 * 3600 * 1000,   // recarga la página cada 6 h para tomar actualizaciones y limpiar memoria
  TZ: 'America/Mexico_City'
};
const ONLY = (qp.get('salas') || '').split(',').map(x => x.trim()).filter(Boolean);
const T = { tempMin: 20, tempMax: 27, humMin: 30, humMax: 60, vocGood: 100, vocWarn: 250, co2Good: 800, co2Warn: 1200, staleMin: 10 };

(function takeKeyFromUrl() {
  const k = qp.get('clave');
  if (!k) return;
  try { localStorage.setItem('wt_access_key', k); } catch (e) { /* sin almacenamiento */ }
  qp.delete('clave');
  const rest = qp.toString();
  try { history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash); } catch (e) { /* */ }
})();

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Reglas (las mismas del dashboard) ---------- */
const fmtHM = d => d.toLocaleTimeString('es-MX', { timeZone: CONFIG.TZ, hour: '2-digit', minute: '2-digit', hour12: false });
const fmtHMS = d => d.toLocaleTimeString('es-MX', { timeZone: CONFIG.TZ, hour12: false });
const ageMin = ts => Math.max(0, (Date.now() / 1000 - ts) / 60);
const isStale = r => ageMin(r.ts) > T.staleMin;
const airLabel = v => v <= T.vocGood ? 'Bueno' : v <= T.vocWarn ? 'Regular' : 'Malo';
const co2Label = v => v <= T.co2Good ? 'Bueno' : v <= T.co2Warn ? 'Regular' : 'Malo';
const airCls = l => l === 'Bueno' ? '' : l === 'Regular' ? 'warn' : l === 'Malo' ? 'bad' : 'na';
const state = (label, cls) => `<span class="state ${cls}"><i></i>${label}</span>`;

function prep(r) {
  const vocI = Math.round(r.vocIndex || 0), co2 = Math.round(r.co2 || 0);
  let air = 'Sin dato', airMetric = 'Calidad del aire', airText = 'Sin dato';
  if (vocI > 0) { air = airLabel(vocI); airMetric = 'VOC Index'; airText = String(vocI); }
  else if (co2 > 0) { air = co2Label(co2); airMetric = 'CO₂'; airText = co2 + ' ppm'; }
  return Object.assign({}, r, { t: Math.round(r.temp), h: Math.round(r.humidity), air, airMetric, airText });
}
function alertsOf(r) {
  const a = [];
  if (isStale(r)) a.push('Sin datos recientes');
  if (r.t < T.tempMin) a.push('Temperatura baja'); else if (r.t > T.tempMax) a.push('Temperatura alta');
  if (r.h < T.humMin) a.push('Humedad baja'); else if (r.h > T.humMax) a.push('Humedad alta');
  if (r.air === 'Regular') a.push('Aire regular'); else if (r.air === 'Malo') a.push('Aire malo');
  return a;
}

/* ---------- Datos ---------- */
function normalizeRoom(r) {
  const block = r.roomData || r.endpointData;
  const d = block && block.data && block.data[0];
  if (!d) throw new Error('sin datos de sensor');
  return { id: r.id, name: r.name, ts: Number(d.timestamp), temp: d.temp, humidity: d.humidity, vocIndex: d.vocIndex, co2: d.co2, illumination: d.illumination, people: d.people };
}
function demoData() {
  const now = Math.floor(Date.now() / 1000);
  const mk = (id, name, off, temp, hum, co2, vocIndex, people) => ({ id, name, ts: now - off, temp, humidity: hum, co2, vocIndex, illumination: 200, people });
  return [
    mk(22, 'Neat Board32 GDL', 30, 25.2, 51.4, 0, 70, 1),
    mk(19, 'Neat Diego', 25, 24.8, 47, 0, 66, 0),
    mk(10, 'Neat Frame Kiosk', 120, 23.4, 49.2, 0, 40, 0),
    mk(4, 'Sala Brasil GDL', 50, 23.6, 32.1, 580, 0, 2),
    mk(5, 'Sala México GDL', 20, 27.8, 66, 1350, 0, 6),
    mk(15, 'Sala Movil MX', 15, 20.5, 54.3, 455, 0, 0),
    mk(6, 'Sala Training GDL', 1100, 24.1, 45, 0, 160, 3)
  ];
}
async function fetchRooms() {
  if (CONFIG.DEMO) return demoData();
  let key = '';
  try { key = localStorage.getItem('wt_access_key') || ''; } catch (e) { /* */ }
  const res = await fetch(CONFIG.API_URL, { headers: key ? { 'X-Access-Key': key } : {} });
  if (res.status === 401) { const err = new Error('clave'); err.auth = true; throw err; }
  if (!res.ok) throw new Error('respuesta ' + res.status);
  const json = await res.json();
  const ok = [];
  (json.rooms || []).forEach(r => { try { ok.push(normalizeRoom(r)); } catch (e) { /* sala sin sensores: no se muestra */ } });
  if (!ok.length) throw new Error('ninguna sala devolvió datos');
  return ok;
}

/* ---------- Estado y pantalla ---------- */
let rooms = [], lastOk = 0, failing = false, authError = false, timer = null, wake = null;

function roomCard(r) {
  const al = alertsOf(r), shown = al.slice(0, 2), more = al.length - shown.length;
  const chips = shown.map(x => `<li>${x}</li>`).join('') + (more > 0 ? `<li>+${more}</li>` : '');
  return `<article class="rc${isStale(r) ? ' stale' : ''}">
    <header><h2>${esc(r.name)}</h2>${state(r.air === 'Sin dato' ? 'Aire sin dato' : 'Aire ' + r.air.toLowerCase(), airCls(r.air))}</header>
    <div class="body">
      <div class="well${r.people ? '' : ' empty'}"><b>${r.people}</b><span>${r.people === 1 ? 'persona' : 'personas'}</span></div>
      <dl>
        <div><dt>Temperatura</dt><dd>${r.t} °C</dd></div>
        <div><dt>Humedad</dt><dd>${r.h} %</dd></div>
        <div><dt>${esc(r.airMetric)}</dt><dd>${esc(r.airText)}</dd></div>
      </dl>
    </div>
    <ul class="chips">${chips}</ul>
  </article>`;
}

function message(title, text) {
  return `<div class="msg"><strong>${title}</strong><span>${text}</span></div>`;
}

function render() {
  const grid = $('#grid'), kp = $('#kpis');
  let list = rooms;
  if (ONLY.length) list = list.filter(r => ONLY.includes(String(r.id)));

  if (!list.length) {
    kp.hidden = true;
    grid.style.fontSize = '';
    if (authError) grid.innerHTML = message('Este panel requiere clave de acceso', 'Abre la dirección con ?clave=TU_CLAVE. Se guarda en esta pantalla y se quita de la dirección.');
    else if (failing) grid.innerHTML = message('No se pudo conectar con el servidor', 'Se vuelve a intentar automáticamente.');
    else grid.innerHTML = message('Cargando datos de las salas...', '');
    return;
  }

  const people = list.reduce((a, r) => a + r.people, 0);
  const occ = list.filter(r => r.people > 0).length;
  const avgT = Math.round(list.reduce((a, r) => a + r.temp, 0) / list.length);
  const avgH = Math.round(list.reduce((a, r) => a + r.humidity, 0) / list.length);
  kp.hidden = false;
  kp.innerHTML = [
    ['Personas ahora', people, ''],
    ['Salas ocupadas', occ, `de ${list.length}`],
    ['Temperatura promedio', avgT, '°C'],
    ['Humedad promedio', avgH, '%']
  ].map(k => `<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}${k[2] ? `<small>${k[2]}</small>` : ''}</div></div>`).join('');

  grid.innerHTML = list.map(roomCard).join('');
  layout();
}

/* Reparte el espacio: elige columnas y filas para que las cartas queden lo más grandes posible */
function layout() {
  const grid = $('#grid'), cards = grid.querySelectorAll('.rc');
  const n = cards.length;
  if (!n) return;
  const W = grid.clientWidth, H = grid.clientHeight;
  const gap = Math.round(Math.min(W, H) * 0.035);
  const ratio = 1.3;                       // proporción ideal ancho/alto de una carta
  let best = null;
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c);
    const cw = (W - gap * (c - 1)) / c, ch = (H - gap * (r - 1)) / r;
    const score = Math.min(cw, ch * ratio);
    if (!best || score > best.score) best = { cw, ch, score };
  }
  const u = Math.max(8, Math.min(best.cw / 18.5, best.ch / 14, 52));   // tamaño de letra base en px
  grid.style.fontSize = u + 'px';
  grid.style.gap = gap + 'px';
  cards.forEach(el => { el.style.width = Math.floor(best.cw) + 'px'; el.style.height = Math.floor(best.ch) + 'px'; });
}

function tickClock() {
  $('#clock').textContent = fmtHM(new Date());
  const live = $('#live'), st = $('#status');
  if (!lastOk) { st.textContent = failing ? 'Sin conexión' : 'Cargando datos...'; live.className = 'live off'; return; }
  const staleData = (Date.now() - lastOk) > 5 * 60 * 1000;
  live.className = 'live' + (failing && staleData ? ' off' : '');
  st.textContent = (failing && staleData ? 'Sin conexión. Datos de las ' : 'Actualizado ') + fmtHMS(new Date(lastOk));
}

async function refresh() {
  clearTimeout(timer);
  let next = CONFIG.EVERY_MS;
  try {
    rooms = (await fetchRooms()).map(prep);
    lastOk = Date.now(); failing = false; authError = false;
  } catch (e) {
    failing = true; authError = !!e.auth;
    next = CONFIG.RETRY_MS;
  }
  render(); tickClock();
  timer = setTimeout(refresh, next);
}

/* ---------- Comportamiento de pantalla ---------- */
async function keepAwake() {              // evita que la pantalla se apague, donde el navegador lo permite
  try { if ('wakeLock' in navigator) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) { /* */ }
}
function toggleFullscreen() {
  const d = document;
  if (d.fullscreenElement) { d.exitFullscreen(); return; }
  const el = d.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
}
let idleTimer;
function wakeCursor() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
}

function init() {
  wakeCursor();
  document.addEventListener('mousemove', wakeCursor);
  document.addEventListener('dblclick', toggleFullscreen);
  document.addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') toggleFullscreen(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { keepAwake(); if (Date.now() - lastOk > CONFIG.EVERY_MS) refresh(); } });
  window.addEventListener('resize', layout);
  keepAwake();
  tickClock();
  setInterval(tickClock, 15000);
  setTimeout(() => location.reload(), CONFIG.RELOAD_MS);
  render();
  refresh();
}
init();
})();
</script>
</body>
